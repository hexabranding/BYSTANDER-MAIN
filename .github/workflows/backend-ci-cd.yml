
name: Bystander Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'package-lock.json'
      - '.github/workflows/backend-ci-cd.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'package-lock.json'
      - '.github/workflows/backend-ci-cd.yml'

permissions:
  contents: read

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MongoDB server binary
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc |
            sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" |
            sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-server
          mongod --version

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev --package-lock=false

      - name: Run backend tests
        working-directory: backend
        run: npm test

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy backend through SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'set -e
             cd /var/www/BYSTANDER-MAIN
             git fetch origin main
             git reset --hard origin/main
             cd backend
             npm install --omit=dev --package-lock=false
             pm2 restart bystander-api --update-env
             sleep 5
             curl --fail --silent --show-error http://127.0.0.1:5001/api/health'
